name: Code coverage

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_FOLDER: build

jobs:
  build:
    name: linux-64
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v3
        id: cpu-cores

      - name: Setup environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          # TODO: Go back to "latest" when https://github.com/conda-incubator/setup-miniconda/issues/589 is fixed
          miniforge-version: 26.7.2-0
          activate-environment: biorbd
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Install dependencies
        run: |
          # Ubuntu's GCC now targets AVX2 by default, which changes Eigen's memory alignment and makes biorbd
          # incompatible with the conda-forge RBDL binaries. Build with conda-forge's compiler (and its gcov) instead
          conda install "rbdl>=3.3.1" tinyxml2 ipopt lcov cxx-compiler
          conda list

      - name: Setup Linux dependencies
        run: |
          sudo apt update
          sudo apt install libstdc++-11-dev

      - name: Perform code coverage
        run: |
          BIORBD_FOLDER=`pwd`
          CONDA_ENV_PATH=$CONDA/envs/biorbd
          mkdir -p $BIORBD_FOLDER/$BUILD_FOLDER
          cd $BIORBD_FOLDER/$BUILD_FOLDER
          cmake .. \
                -DCMAKE_INSTALL_PREFIX=$CONDA_ENV_PATH \
                -DCMAKE_BUILD_TYPE=Coverage \
                -DMODULE_ACTUATORS=ON \
                -DMODULE_KALMAN=ON \
                -DMODULE_LIGAMENTS=ON \
                -DMODULE_MUSCLES=ON \
                -DMODULE_PASSIVE_TORQUES=ON \
                -DMODULE_STATIC_OPTIM=ON \
                -DMODULE_VTP_FILES_READER=ON \
                -DBUILD_TESTS=ON \
                -DBUILD_EXAMPLE=OFF
          cp -r test/models/ .
          # The coverage target runs the tests and produces coverage.info (see modules/CodeCoverage.cmake)
          make biorbd_eigen_coverage -j${{ steps.cpu-cores.outputs.count }}
          lcov --list coverage.info
          cd $BIORBD_FOLDER

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ${{ env.BUILD_FOLDER }}/coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
