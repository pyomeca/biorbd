name: Code coverage

on: [pull_request]

env:
  BUILD_FOLDER: build
  EXAMPLES_FOLDER: examples

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-64
            prefix: /usr/share/miniconda3/envs/biorbd
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l -eo pipefail {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v1
        id: cpu-cores

      - name: Setup environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: biorbd

      - name: Install dependencies
        run: |
          conda install -cconda-forge rbdl=3.3.1 tinyxml2 ipopt lcov=1.16
          conda list

      - name: Setup Linux dependencies
        run:   |
         sudo apt update
         sudo apt install libstdc++-11-dev
        if: matrix.label == 'linux-64'

      - name: Perform code coverage 
        run: |
          BIORBD_FOLDER=`pwd`
          CONDA_ENV_PATH=$CONDA_PREFIX
          mkdir -p $BIORBD_FOLDER/$BUILD_FOLDER
          cd $BIORBD_FOLDER/$BUILD_FOLDER
          cmake .. \
                -DCMAKE_INSTALL_PREFIX=$CONDA_ENV_PATH \
                -DCMAKE_PREFIX_PATH=$CONDA_ENV_PATH \
                -DCMAKE_BUILD_TYPE=Coverage \
                -DBUILD_TESTS=ON \
                -DBUILD_EXAMPLE=OFF \
                -DMODULE_ACTUATORS=ON \
                -DMODULE_MUSCLES=ON \
                -DMODULE_PASSIVE_TORQUES=ON \
                -DMODULE_KALMAN=ON
          cp -r test/models/ .
          make biorbd_eigen_coverage -j${{ steps.cpu-cores.outputs.count }}
          lcov --directory . --capture --output-file coverage.info
          lcov --remove coverage.info '/usr/*' --output-file coverage.info
          lcov --list coverage.info
          cd $BIORBD_FOLDER

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ${{ env.BUILD_FOLDER }}/coverage.info
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
