name: Run PIP tests

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-64
          # - os: macos-latest
          #   label: osx-arm64
          - os: windows-latest
            label: win-64
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          # TODO: Go back to "latest" when https://github.com/conda-incubator/setup-miniconda/issues/589 is fixed
          miniforge-version: 26.7.2-0
          activate-environment: biorbd
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Install dependencies
        run: |
          conda install "swig<4.4.0" pip "eigen<4.0.0"
          conda list

      - name: Setup Linux dependencies
        run: |
          sudo apt update
          sudo apt install libstdc++-11-dev
        if: matrix.label == 'linux-64'

      - name: Build biorbd
        run: |
          rm -rf _skbuild
          export MATH_LIBRARY_BACKEND=Eigen3
          pip install .

      - name: Test installed version of biorbd
        run: |
          BIORBD_FOLDER=`pwd`
          cd
          python -c "import biorbd"
          cd $BIORBD_FOLDER
