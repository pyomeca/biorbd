name: Publish MATLAB binaries

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Never interrupt a publication

env:
  BUILD_FOLDER: build

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-64
            # Ubuntu's GCC now targets AVX2 by default, which changes Eigen's memory alignment and makes
            # biorbd incompatible with the conda-forge RBDL binaries. Build with conda-forge's compiler instead
            conda_compiler: cxx-compiler
          - os: macos-latest
            label: osx-arm64
          - os: windows-latest
            label: win-64
            cmake_generator: -G"Visual Studio 18 2026" -Ax64
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v3
        id: cpu-cores

      - name: Setup environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          # TODO: Go back to "latest" when https://github.com/conda-incubator/setup-miniconda/issues/589 is fixed
          miniforge-version: 26.7.2-0
          activate-environment: biorbd
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Setup Linux dependencies
        run: |
          sudo apt update
          sudo apt install libstdc++-11-dev
        if: matrix.label == 'linux-64'

      - name: Install dependencies
        run: |
          conda install "rbdl>=3.3.1" cmake git pkgconfig ${{ matrix.conda_compiler }}
          conda list

      - name: Install MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          cache: true

      # Ipopt is not shipped with the binaries, so MODULE_STATIC_OPTIM must stay OFF.
      # TinyXML2 is not installed so it is built statically from source.
      - name: Build biorbd
        run: |
          BIORBD_FOLDER=`pwd`
          CONDA_ENV_PATH=$CONDA/envs/biorbd
          mkdir -p $BIORBD_FOLDER/$BUILD_FOLDER
          cd $BIORBD_FOLDER/$BUILD_FOLDER
          cmake .. ${{ matrix.cmake_generator }} \
                -DCMAKE_INSTALL_PREFIX=$CONDA_ENV_PATH \
                -DMATH_LIBRARY_BACKEND="Eigen3" \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=OFF \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                -DMODULE_ACTUATORS=ON \
                -DMODULE_KALMAN=ON \
                -DMODULE_LIGAMENTS=ON \
                -DMODULE_MUSCLES=ON \
                -DMODULE_PASSIVE_TORQUES=ON \
                -DMODULE_STATIC_OPTIM=OFF \
                -DMODULE_VTP_FILES_READER=ON \
                -DBUILD_TESTS=OFF \
                -DBUILD_DOC=OFF \
                -DBUILD_EXAMPLE=OFF \
                -DBINDER_MATLAB=ON \
                -DMatlab_biorbd_eigen_INSTALL_DIR=$HOME
          cmake --build . --config Release --target install --parallel ${{ steps.cpu-cores.outputs.count }}
          cd $BIORBD_FOLDER

      - name: Build MATLAB archives on UNIX
        run: |
          cp -r $HOME/biorbd_matlab .
          zip -r biorbd_matlab_${{ matrix.label }}.zip biorbd_matlab
        if: matrix.label != 'win-64'

      - name: Build MATLAB archives on WINDOWS
        run: |
          7z a biorbd_matlab_${{ matrix.label }}.zip $HOME/biorbd_matlab
        if: matrix.label == 'win-64'

      - name: Upload files to a GitHub release
        uses: xresloader/upload-to-github-release@v1.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "biorbd_matlab_${{ matrix.label }}.zip"
          update_latest_release: true
          verbose: true
          overwrite: true
