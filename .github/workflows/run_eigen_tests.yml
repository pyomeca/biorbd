name: Run the Eigen tests

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_FOLDER: build
  EXAMPLES_FOLDER: examples

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-64
          - os: macos-latest
            label: osx-arm64
          - os: windows-latest
            label: win-64
            cmake_generator: -G"Visual Studio 18 2026" -Ax64
            bin_folder: Release/
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v3
        id: cpu-cores

      - name: Setup environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          # TODO: Go back to "latest" when https://github.com/conda-incubator/setup-miniconda/issues/589 is fixed
          miniforge-version: 26.7.2-0
          activate-environment: biorbd
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Install dependencies
        run: |
          conda install "rbdl>=3.3.1" tinyxml2 ipopt "swig<4.4.0" python numpy scipy pytest doxygen
          conda list

      - name: Setup Linux dependencies
        run: |
          sudo apt update
          sudo apt install libstdc++-11-dev
        if: matrix.label == 'linux-64'

      - name: Install MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          cache: true

      - name: Build biorbd
        run: |
          BIORBD_FOLDER=`pwd`
          CONDA_ENV_PATH=$CONDA/envs/biorbd
          mkdir -p $BIORBD_FOLDER/$BUILD_FOLDER
          cd $BIORBD_FOLDER/$BUILD_FOLDER
          cmake .. ${{ matrix.cmake_generator }} \
                -DCMAKE_INSTALL_PREFIX=$CONDA_ENV_PATH \
                -DMATH_LIBRARY_BACKEND="Eigen3" \
                -DCMAKE_BUILD_TYPE=Release \
                -DMODULE_ACTUATORS=ON \
                -DMODULE_KALMAN=ON \
                -DMODULE_LIGAMENTS=ON \
                -DMODULE_MUSCLES=ON \
                -DMODULE_PASSIVE_TORQUES=ON \
                -DMODULE_STATIC_OPTIM=ON \
                -DMODULE_VTP_FILES_READER=ON \
                -DBUILD_TESTS=ON \
                -DBUILD_EXAMPLE=ON \
                -DBUILD_DOC=ON \
                -DBINDER_C=ON \
                -DBINDER_PYTHON3=ON \
                -DBINDER_MATLAB=ON \
                -DMatlab_biorbd_eigen_INSTALL_DIR=$HOME
          cmake --build . --config Release --target install --parallel ${{ steps.cpu-cores.outputs.count }}
          cd $BIORBD_FOLDER

      # TODO: Remove this step once the Linux "double free or corruption" crash is understood
      - name: Diagnostics (Linux)
        continue-on-error: true
        run: |
          echo "::group::Packages"
          conda list | grep -E "^(rbdl|eigen|eigen-abi|casadi|libstdcxx|libgcc|python|tinyxml2|ipopt) "
          echo "::endgroup::"
          echo "::group::Compiler"
          which c++ g++ cmake
          c++ --version
          echo "CFLAGS=$CFLAGS CXXFLAGS=$CXXFLAGS CPPFLAGS=$CPPFLAGS LDFLAGS=$LDFLAGS"
          echo | c++ -dM -E -x c++ - | grep -E "__AVX|__SSE|__FMA|__cplusplus"
          grep -E "CXX_FLAGS|CXX_DEFINES" $BUILD_FOLDER/CMakeFiles/biorbd_eigen.dir/flags.make || true
          grep -E "RBDL|Eigen3_DIR|EIGEN3" $BUILD_FOLDER/CMakeCache.txt | head -20
          echo "::endgroup::"
          echo "::group::Loaded libraries"
          ldd $BUILD_FOLDER/test/biorbd_eigen_tests | grep -E "rbdl|biorbd|stdc|tinyxml|ipopt"
          echo "::endgroup::"
          echo "::group::Crash backtrace"
          command -v gdb || sudo apt-get install -y gdb > /dev/null
          cd $BUILD_FOLDER/test
          gdb -batch -ex run -ex bt --args ./biorbd_eigen_tests --gtest_filter=FileIO.openModelWithActuators 2>&1 | tail -60
          echo "::endgroup::"
        if: matrix.label == 'linux-64'

      - name: Run tests
        run: |
          BIORBD_FOLDER=`pwd`
          cd $BIORBD_FOLDER/$BUILD_FOLDER/test
          ./${{ matrix.bin_folder }}biorbd_eigen_tests
          cd $BIORBD_FOLDER

      - name: Run c binder tests
        run: |
          BIORBD_FOLDER=`pwd`
          cd $BIORBD_FOLDER/$BUILD_FOLDER/test/binding/c
          ./${{ matrix.bin_folder }}biorbd_eigen_tests_binding_c
          cd $BIORBD_FOLDER

      - name: Run python binder tests
        run: |
          BIORBD_FOLDER=`pwd`
          cd $BIORBD_FOLDER/$BUILD_FOLDER/test/binding/python3
          export CI_MAIN_EXAMPLES_FOLDER=$BIORBD_FOLDER/$EXAMPLES_FOLDER
          pytest .
          cd $BIORBD_FOLDER

      # The MATLAB binder tests cannot be run as we do not have a license. At least we know it compiles

      - name: Test installed version of C++
        run: |
          BIORBD_FOLDER=`pwd`
          CONDA_ENV_PATH=$CONDA/envs/biorbd
          cd $BIORBD_FOLDER/$EXAMPLES_FOLDER/cpp_eigen_installed
          mkdir -p $BUILD_FOLDER
          cd $BUILD_FOLDER
          cmake .. ${{ matrix.cmake_generator }} \
                -DCMAKE_INSTALL_PREFIX=$CONDA_ENV_PATH \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release --parallel ${{ steps.cpu-cores.outputs.count }}
          ./${{ matrix.bin_folder }}forwardDynamicsExample
          cd $BIORBD_FOLDER

      - name: Test installed version of python
        run: |
          BIORBD_FOLDER=`pwd`
          cd
          python -c "import biorbd"
          cd $BIORBD_FOLDER
