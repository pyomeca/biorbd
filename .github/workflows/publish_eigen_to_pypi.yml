name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Never interrupt a publication

jobs:
  build_wheels:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-64
          - os: macos-latest
            label: osx-arm64
          - os: windows-latest
            label: win-64
    name: Wheels ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Eigen is downloaded once (and cached between runs) rather than by each build. The archive is verified
      # against its hash when used (see modules/FindOrBuildEigen3.cmake)
      - name: Cache the Eigen archive
        id: cache-eigen
        uses: actions/cache@v6
        with:
          path: .eigen_cache
          key: eigen-3.4.0-8586084f71f9bde5

      - name: Download the Eigen archive
        if: steps.cache-eigen.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .eigen_cache
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 15 -o .eigen_cache/eigen-3.4.0.tar.gz \
            https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz

      # The cibuildwheel options are in the [tool.cibuildwheel] section of pyproject.toml
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.4
        env:
          CIBW_ENVIRONMENT: MATH_LIBRARY_BACKEND=Eigen3 BIORBD_EIGEN3_ARCHIVE=.eigen_cache/eigen-3.4.0.tar.gz

      - name: Store the wheels
        uses: actions/upload-artifact@v7
        with:
          name: python-package-wheels-${{ matrix.label }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish-to-pypi:
    name: Publish to PyPI
    # The sdist is not published as it cannot produce a working install yet (the shared
    # libraries are only bundled into the wheels by the cibuildwheel repair step)
    needs:
      - build_wheels
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/biorbd

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          pattern: python-package-wheels-*
          path: dist/
          merge-multiple: true

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3

  publish-to-testpypi:
    name: Publish to TestPyPI
    # The sdist is not published as it cannot produce a working install yet (the shared
    # libraries are only bundled into the wheels by the cibuildwheel repair step)
    needs:
      - build_wheels
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/biorbd

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          pattern: python-package-wheels-*
          path: dist/
          merge-multiple: true

      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
