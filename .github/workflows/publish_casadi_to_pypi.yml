name: Publish biorbd_casadi to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Never interrupt a publication

jobs:
  build_wheels:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-64
          - os: macos-latest
            label: osx-arm64
          - os: windows-latest
            label: win-64
    name: Wheels ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The other cibuildwheel options are in the [tool.cibuildwheel] section of pyproject.toml.
      # The casadi library must not be bundled in the wheels: biorbd_casadi exchanges casadi objects with the casadi
      # python package, so it must use the library of that package (the exact version is pinned by setup.py)
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.4
        env:
          CIBW_ENVIRONMENT: MATH_LIBRARY_BACKEND=Casadi
          CIBW_TEST_COMMAND: python -c "import biorbd_casadi; print(biorbd_casadi.__file__)"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: auditwheel repair --exclude "libcasadi.so.*" -w {dest_dir} {wheel}
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: delocate-wheel --require-archs {delocate_archs} --exclude libcasadi -w {dest_dir} -v {wheel}
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair --exclude libcasadi.dll -w {dest_dir} {wheel}

      - name: Store the wheels
        uses: actions/upload-artifact@v7
        with:
          name: python-package-wheels-${{ matrix.label }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish-to-pypi:
    name: Publish to PyPI
    # The sdist is not published as it cannot produce a working install yet (the shared
    # libraries are only bundled into the wheels by the cibuildwheel repair step)
    needs:
      - build_wheels
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/biorbd_casadi

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          pattern: python-package-wheels-*
          path: dist/
          merge-multiple: true

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3

  publish-to-testpypi:
    name: Publish to TestPyPI
    # The sdist is not published as it cannot produce a working install yet (the shared
    # libraries are only bundled into the wheels by the cibuildwheel repair step)
    needs:
      - build_wheels
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/biorbd_casadi

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          pattern: python-package-wheels-*
          path: dist/
          merge-multiple: true

      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
