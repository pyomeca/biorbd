[build-system]
requires = [
    "setuptools>=61.0",
    "setuptools-scm>=8",
    "wheel",
    "scikit-build",
    "cmake",
    "ninja",
    "swig",
    "numpy",
    "scipy",
]
build-backend = "setuptools.build_meta"

[project]
name = "biorbd"
dynamic = ["version"]
dependencies = [
    "numpy",
    "scipy"
]
description = "Biomechanical add-ons to the RigidBody Dynamics Library"
readme = "README.md"  # This links to your README file
authors = [
    {name = "Michaud, Benjamin"},
    {name = "Begon, Mickaël"}
]
license = "MIT"
urls = { "Homepage" = "https://github.com/pyomeca/biorbd" }
requires-python = ">=3.10"

[tool.cibuildwheel]
build-frontend = "build"
archs = ["auto64"]
# musllinux and free-threaded Python are not supported yet
skip = ["*-musllinux_*", "cp3??t-*"]
before-build = "python -c \"import shutil; shutil.rmtree('_skbuild', ignore_errors=True)\""
test-command = "python -c \"import biorbd; print(biorbd.__file__)\""
